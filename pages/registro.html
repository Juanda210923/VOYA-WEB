<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="VOYA: descubre destinos y planifica tu próximo viaje.">
    <title>VOYA — Soporte y contacto</title>

</head>

<!-- cuepro -->
<body class="login-page">
    <main class="login-card"><a class="header__brand" href="../index.html"><span
                class="brand-mark">✈</span><span>VOYA</span></a><span class="eyebrow">Registrar cuenta</span>
        <p>Querido usuario para realizar la creación de su cuenta, 
        llene los campos del siguiente formulario siguiendo las instrucciones dadas:</p>
        <form action="#" method="get">
            <div class="form-group"><label for="name">Nombre</label><input class="form-control"
                                    id="name" name="nombre" placeholder="Nombre completo" required></div>
                                    
           <div class="form-group"><label for="dates">Fecha de Nacimiento</label><input class="form-control"
                                    <input type="date" class="search-box__input" id="dates" name="fecha" placeholder="Elige tus fechas" required></div>                         
           <div class="form-group"><label for="tel">Número de Cédula</label><input class="form-control" id="cedula"
                    requiredtype="tel" name="cédula" placeholder="Ej: 1049802673"pattern="[0-9]{10}" required></div> 
                    
           <div class="form-group"><label for="tel">Número de Celular</label><input class="form-control" id="celular"
                    requiredtype="tel" name="celular" placeholder="328170972"pattern="[0-9]{10}" required></div>                     
                                    
                                    
            <div class="form-group"><label for="email">Correo electrónico</label><input class="form-control" id="email"
                    type="email" placeholder="tu@correo.com" required></div>

            <div class="form-group"><label for="password">Contraseña </label><input class="form-control" id="password"
                    type="password" placeholder="Introduce tu contraseña" required></div><button
                    
                class="btn btn--primary btn--pill" style="width:100%" type="submit">Crear cuenta</button>
        </form>
        </main>
